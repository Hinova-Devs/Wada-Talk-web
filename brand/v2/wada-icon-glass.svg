<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14305E"/><stop offset="1" stop-color="#070D1F"/></linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#26AEE8" stop-opacity="0.55"/><stop offset="1" stop-color="#26AEE8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gr" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF6B57" stop-opacity="0.5"/><stop offset="1" stop-color="#FF6B57" stop-opacity="0"/></radialGradient>
    <linearGradient id="cy" gradientUnits="userSpaceOnUse" x1="230" y1="200" x2="560" y2="780"><stop offset="0" stop-color="#9BEBFF"/><stop offset="0.5" stop-color="#35B7F0"/><stop offset="1" stop-color="#1368D0"/></linearGradient>
    <linearGradient id="co" gradientUnits="userSpaceOnUse" x1="480" y1="320" x2="800" y2="880"><stop offset="0" stop-color="#FFD3A0"/><stop offset="0.5" stop-color="#FF8D62"/><stop offset="1" stop-color="#E8483F"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F4FBFF"/><stop offset="1" stop-color="#FFE9DD"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F6FD0"/><stop offset="1" stop-color="#E8483F"/></linearGradient>
    <clipPath id="lc"><circle cx="404" cy="452" r="232"/></clipPath>
    <clipPath id="cc"><circle cx="624" cy="560" r="232"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shb" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1150"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#0A5FD0" flood-opacity="0.55"/></filter>
    <filter id="shc" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1150"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#FF4E3A" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="300" cy="360" r="380" fill="url(#gl)"/>
  <circle cx="740" cy="700" r="380" fill="url(#gr)"/>
  <g transform="translate(512 520) scale(1.14) translate(-526 -544)">
    <!-- blue bubble -->
    <g filter="url(#shb)">
      <circle cx="404" cy="452" r="232" fill="url(#cy)"/>
      <path d="M262 600 L196 790 L408 676 Z" fill="url(#cy)" stroke="url(#cy)" stroke-width="26" stroke-linejoin="round"/>
    </g>
    <circle cx="404" cy="452" r="226" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <g clip-path="url(#lc)"><ellipse cx="330" cy="290" rx="150" ry="70" fill="#fff" opacity="0.5" filter="url(#blur)" transform="rotate(-28 330 290)"/></g>
    <!-- coral bubble -->
    <g filter="url(#shc)">
      <circle cx="624" cy="560" r="232" fill="url(#co)"/>
      <path d="M766 706 L836 868 L616 786 Z" fill="url(#co)" stroke="url(#co)" stroke-width="26" stroke-linejoin="round"/>
    </g>
    <circle cx="624" cy="560" r="226" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <g clip-path="url(#cc)"><ellipse cx="700" cy="420" rx="130" ry="56" fill="#fff" opacity="0.42" filter="url(#blur)" transform="rotate(-22 700 420)"/></g>
    <!-- glass lens where they meet -->
    <g clip-path="url(#lc)"><circle cx="624" cy="560" r="232" fill="url(#lens)" opacity="0.93"/></g>
    <g clip-path="url(#lc)"><circle cx="624" cy="560" r="226" fill="none" stroke="#fff" stroke-width="5" opacity="0.9"/></g>
    <g transform="translate(515 498)" fill="none" stroke="url(#globe)" stroke-width="14" stroke-linecap="round">
      <circle r="92"/><ellipse rx="42" ry="92"/><path d="M-92 0H92"/>
      <path d="M-78 -46Q0 -30 78 -46"/><path d="M-78 46Q0 30 78 46"/>
    </g>
  </g>
</svg>
